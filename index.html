<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ترست لمعدات المخابز | نسخة تجريبية</title>
<style>
:root{--g:#1f7a6d;--b:#1b5e8c;--ink:#1d2427;--mut:#5b676b;--bg:#f6f8f8}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.7}
.bar{background:#fff3cd;color:#664d03;text-align:center;padding:8px 12px;font-size:14px}
header{background:linear-gradient(135deg,var(--b),var(--g));color:#fff;padding:48px 20px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(26px,6vw,42px)}header p{margin:0 auto;max-width:560px;opacity:.95}
.logo{font-weight:800;letter-spacing:4px;font-size:15px;opacity:.85;margin-bottom:10px;direction:ltr}
main{max-width:1000px;margin:0 auto;padding:28px 16px}h2{font-size:24px;margin:0 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px}
.ph{height:130px;border-radius:10px;background:repeating-linear-gradient(45deg,#e8eeee,#e8eeee 10px,#f1f5f5 10px,#f1f5f5 20px);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.tag{font-size:12px;color:var(--g);font-weight:700}.card h3{margin:0;font-size:19px}.card p{margin:0;color:var(--mut);font-size:14px}
.price{font-size:20px;font-weight:800;color:var(--b);margin-top:auto}.price small{font-size:12px;font-weight:400;color:var(--mut)}
.btn{display:block;text-align:center;background:var(--g);color:#fff;border-radius:8px;padding:10px;text-decoration:none;font-weight:700}
footer{text-align:center;color:var(--mut);font-size:13px;padding:24px 16px 40px}
</style></head><body>
<div class="bar">نسخة تجريبية للمراجعة. الأسعار افتراضية وليست أسعار ترست الحقيقية.</div>
<header><div class="logo">TERST</div><h1>ترست لمعدات المخابز</h1><p>أفران وعجانات ومضارب وماكينات حلويات للمخابز والمصانع.</p></header>
<main><h2>المنتجات</h2><div class="grid" id="g"></div></main>
<footer>للاستفسار وعروض الأسعار تواصل مع ترست عبر صفحتها على فيسبوك. بيانات التواصل تُضاف بعد تأكيدها.</footer>
<script>
var P=[["أفران","فرن 5070 ترست","فرن مخابز من ترست للإنتاج اليومي.",85000],["أفران","فرن 6080 ترست","الفرن الأكبر في الخط، لإنتاج أعلى.",110000],["عجانات","عجان دودة","عجان دودة لتجهيز العجين بانتظام.",48000],["خلاطات","مضرب","مضرب للكريمات والخلطات والحلويات.",32000],["ماكينات حلويات","مكنة كحك","ماكينة تشكيل الكحك.",41000],["ماكينات حلويات","مكنة بسكوت","ماكينة تشكيل البسكويت.",56000]];
document.getElementById("g").innerHTML=P.map(function(p){return '<div class="card"><div class="ph">صورة المنتج لاحقًا</div><span class="tag">'+p[0]+'</span><h3>'+p[1]+'</h3><p>'+p[2]+'</p><div class="price">'+p[3].toLocaleString("ar-EG")+' جنيه <small>(سعر افتراضي)</small></div><a class="btn" href="#">اطلب عرض سعر</a></div>'}).join("");
</script></body></html>
